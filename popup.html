<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snip In Browser</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img class="head__mark" src="icons/snipper.png" alt="" width="18" height="18" />
      <h1 class="head__title">Snip In Browser</h1>
      <button
        type="button"
        class="chip"
        id="shortcut"
        title="Change this shortcut in Chrome"
      >
        <span id="shortcut-keys">…</span>
      </button>
    </header>

    <button type="button" class="primary" id="start">
      <!-- Crop-corner marks, the same figure as the product icon. -->
      <svg class="primary__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6" />
      </svg>
      <span>New snip</span>
    </button>

    <p class="alert" id="alert" role="alert" hidden></p>

    <section class="sect" aria-labelledby="opt-h">
      <div class="sect__head">
        <h2 class="sect__title" id="opt-h">Behavior</h2>
      </div>

      <label class="row" for="opt-autocopy">
        <span class="row__text">
          <span class="row__label">Copy when I release the mouse</span>
          <span class="row__hint">Off: pick the region, then press Copy</span>
        </span>
        <input class="switch" type="checkbox" id="opt-autocopy" role="switch" />
      </label>

      <label class="row" for="opt-close">
        <span class="row__text">
          <span class="row__label">Close after copying</span>
          <span class="row__hint">Off: keep refining the same region</span>
        </span>
        <input class="switch" type="checkbox" id="opt-close" role="switch" />
      </label>

      <label class="row" for="opt-save">
        <span class="row__text">
          <span class="row__label">Also save a .png file</span>
          <span class="row__hint">Downloads alongside the copy</span>
        </span>
        <input class="switch" type="checkbox" id="opt-save" role="switch" />
      </label>
    </section>

    <section class="sect" aria-labelledby="rec-h">
      <div class="sect__head">
        <h2 class="sect__title" id="rec-h">Recent</h2>
        <button type="button" class="link" id="clear" hidden>Clear</button>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <div class="snack" id="snack" role="status" aria-live="polite" hidden></div>

    <script src="popup.js"></script>
  </body>
</html>
