<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snip In Browser</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="header">
        <div class="brand">
          <img src="icons/snipper.png" alt="Logo" />
          <h1>Snip In Browser</h1>
        </div>
      </header>

      <div class="main-action">
        <button id="start" class="btn-primary">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7m4 0h6m0 0v6m-6 0l6-6"
            />
          </svg>
          New Snip
        </button>
      </div>

      <div class="settings-group">
        <div class="setting-item">
          <div class="setting-text">
            <span class="label">Auto-copy & Close</span>
            <span class="sublabel">Copy to clipboard immediately</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="autoCopy" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="shortcuts-panel">
        <div class="shortcut-row">
          <span>Toggle Snip</span>
          <kbd id="sc-global">Ctrl+Shift+S</kbd>
        </div>
      </div>

      <div class="history-section">
        <div class="section-header">
          <h2>Recent Snips</h2>
          <button id="clear-history" class="btn-text">Clear</button>
        </div>

        <div id="history-list" class="history-list"></div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
